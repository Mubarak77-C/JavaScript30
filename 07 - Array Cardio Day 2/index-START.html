<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    const currentYear = new Date().getFullYear();
    console.log(currentYear);  //2026
    
   const older= people.some(age=>currentYear-age.year>=19)
   console.log(older)  //true

    // Array.prototype.every() // is everyone 19 or older?
    const everyPeople = people.every(peoples=>currentYear-peoples.year>=19)
    console.log(everyPeople)

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423
    const findComment = comments.find(comment=>comment.id===823423)
    console.log(findComment) //find with data detail row of id 

    // Array.prototype.findIndex()
    // Find the comment with this ID
    const findID = comments.findIndex(comment=>comment.id===823423)
    console.log(findID)  //return index  here  1  

    console.table(comments) ; //before delete id from splice()
    // delete the comment with the ID of 823423
    //by splice() which original data effect change now we need to remove with id
    //from above we get index 1 from id of findIndex()
    //arr.spice(start-from where index to  delete, count- how many index would be delete)
    comments.splice(findID,1); // it start from find id and delete 1 row only
    //
    console.table(`delete id : ${comments}`); // this not work because in console.table `` wont work where ${comments}- 
    // this ${} JS will JavaScript forces everything inside the
    //  ${} to turn into a string so complex then how to show detail then [object Object], [object Object]
    // for message pass by console.log("this id deleted ") then used console.table(comments)
    console.log("the ID with findIndex() ie, 1 index got  will deleted from original comments data:  ");
    console.table(comments);

      
    
 </script>
</body>
</html>
